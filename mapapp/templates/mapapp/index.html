{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Bản đồ du lịch TP.HCM</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{% static 'mapapp/style.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; }

        a{
            color: white;
            text-decoration: none;
            padding: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div style="background-color: rgb(44, 66, 113)" >
        <td>
            <tr><a>TPHCM</a></tr>
            <tr><a href="{% url 'index' %}">Trang chủ</a></tr>
            <tr><a href="{% url 'about' %}">Thông tin</a></tr>
        </td>
    </div>

    <h1>Bản đồ du lịch TP.HCM</h1>
    
    <!-- Đây là thanh tìm kiếm của tớ bạn thân à -->
    <form method="get" action="">
        <input type="text" name="q" placeholder="Tìm kiếm địa điểm">
        <button type="submit">Tìm kiếm</button>
    </form>
     
    <!-- Địa điểm tìm được -->
    <div id="app">
        <div id="map"></div>
        {% for location in locations %}
            <p>{{ location.name }} - {{ location.description }}</p>
        {% endfor %}
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="{% static 'mapapp/script.js' %}"></script>

    <form method="post">
         <h2>Thêm địa điểm mới</h2>
        {% csrf_token %}
       <label for="name">Tên Địa Điểm:</label><br>
       <input type="text" id="name" name="name"><br>
       <label for="latitude">Vĩ độ:</label><br>
       <input type="number" step="0.0000001" id="latitude" name="latitude"><br>
       <label for="longtitude">Kinh độ:</label><br>
       <input type="number" step="0.0000001" id="longtitude" name="longtitude"><br>
       <label for="description">Mô tả:</label><br>
       <input type="text" id="description" name="description"><br><br>
       <input type="submit" value="Thêm Địa Điểm">
   </form>
